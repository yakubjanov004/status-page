# Systemd Drop-in Config — Status Page Service Notify
#
# Bu faylni har bir kuzatiladigan xizmat uchun qo'shish kerak.
# Systemd %n o'zgaruvchisi xizmat nomini avtomatik o'rnatadi.
#
# Sozlash buyruqlari (serverda):
#
# 1. Skriptni joylashtirish:
#    sudo cp deploy/service-notify.sh /usr/local/bin/service-notify.sh
#    sudo chmod +x /usr/local/bin/service-notify.sh
#
# 2. Har bir xizmat uchun drop-in yaratish:
#    Masalan datan.service uchun:
#
#    sudo mkdir -p /etc/systemd/system/datan.service.d/
#    sudo tee /etc/systemd/system/datan.service.d/notify.conf << 'EOF'
#    [Service]
#    ExecStartPost=/usr/local/bin/service-notify.sh up %n
#    ExecStopPost=/usr/local/bin/service-notify.sh down %n
#    EOF
#
# 3. Systemd'ni qayta yuklash:
#    sudo systemctl daemon-reload
#
# 4. Xizmatni qayta ishga tushirish (test qilish):
#    sudo systemctl restart datan.service
#
# Kuzatiladigan xizmatlar ro'yxati:
#   - tokpoint-docker.service
#   - odimrepo-frontend.service  
#   - odimrepo-backend.service
#   - datan.service
#   - alfaconnect-webapp.service
#   - alfaconnect-bot.service
#   - mehmonxona.service
#
# Hammasi uchun bitta buyruq bilan:
#
# for svc in tokpoint-docker odimrepo-frontend odimrepo-backend datan alfaconnect-webapp alfaconnect-bot mehmonxona; do
#   sudo mkdir -p /etc/systemd/system/${svc}.service.d/
#   sudo tee /etc/systemd/system/${svc}.service.d/notify.conf << 'EOF'
# [Service]
# ExecStartPost=/usr/local/bin/service-notify.sh up %n
# ExecStopPost=/usr/local/bin/service-notify.sh down %n
# EOF
# done
# sudo systemctl daemon-reload

[Service]
ExecStartPost=/usr/local/bin/service-notify.sh up %n
ExecStopPost=/usr/local/bin/service-notify.sh down %n
