<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrov Status — All Systems Operational</title>
    <meta name="description" content="Real-time status and uptime monitoring for Darrov services. Check the operational status of all systems.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Design Tokens ─────────────────────────────────── */
        :root {
            --bg:          #f8f9fa;
            --surface:     #ffffff;
            --surface-2:   #f4f4f6;
            --border:      #e5e7eb;
            --border-soft: #f0f0f2;
            --text:        #111827;
            --text-2:      #374151;
            --text-muted:  #6b7280;
            --text-faint:  #9ca3af;

            --up:          #10b981;
            --up-bg:       #ecfdf5;
            --up-border:   #a7f3d0;
            --up-text:     #065f46;

            --warn:        #f59e0b;
            --warn-bg:     #fffbeb;
            --warn-border: #fde68a;
            --warn-text:   #78350f;

            --down:        #ef4444;
            --down-bg:     #fef2f2;
            --down-border: #fecaca;
            --down-text:   #991b1b;

            --accent:      #6366f1;
            --accent-2:    #8b5cf6;

            --radius-sm:   6px;
            --radius-md:   10px;
            --radius-lg:   14px;

            --shadow-sm:   0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md:   0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);

            --transition:  0.18s ease;
        }

        [data-theme="dark"] {
            --bg:          #0d1117;
            --surface:     #161b22;
            --surface-2:   #1c2128;
            --border:      #30363d;
            --border-soft: #21262d;
            --text:        #e6edf3;
            --text-2:      #c9d1d9;
            --text-muted:  #8b949e;
            --text-faint:  #6e7681;

            --up-bg:       #0d2b1e;
            --up-border:   #1a4731;
            --up-text:     #3fb950;

            --warn-bg:     #2b1e08;
            --warn-border: #5a3e0a;
            --warn-text:   #d29922;

            --down-bg:     #2b1218;
            --down-border: #5a1c24;
            --down-text:   #f85149;

            --shadow-sm:   0 1px 3px rgba(0,0,0,0.3);
            --shadow-md:   0 4px 16px rgba(0,0,0,0.4);
        }

        /* ── Reset ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background var(--transition), color var(--transition);
        }

        /* ── Layout ────────────────────────────────────────── */
        .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }

        /* ── Header ────────────────────────────────────────── */
        .site-header {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 56px;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text);
        }
        .logo-mark {
            width: 30px; height: 30px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px; color: #fff;
            box-shadow: 0 2px 8px rgba(99,102,241,0.35);
        }
        .logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .last-updated {
            font-size: 12px; color: var(--text-faint);
            display: flex; align-items: center; gap: 5px;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--up); display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .theme-btn {
            width: 32px; height: 32px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: all var(--transition);
        }
        .theme-btn:hover { background: var(--border); color: var(--text); }

        /* ── Page body ─────────────────────────────────────── */
        .page-body { padding: 36px 0 60px; }

        /* ── Status Banner ─────────────────────────────────── */
        .status-banner {
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 28px;
            border: 1px solid;
            position: relative; overflow: hidden;
            transition: all var(--transition);
        }
        .status-banner::before {
            content: '';
            position: absolute; inset: 0;
            opacity: 0.05;
            background: radial-gradient(ellipse at top left, currentColor 0%, transparent 70%);
            pointer-events: none;
        }
        .status-banner.operational {
            background: var(--up-bg); border-color: var(--up-border); color: var(--up-text);
        }
        .status-banner.degraded {
            background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text);
        }
        .status-banner.outage {
            background: var(--down-bg); border-color: var(--down-border); color: var(--down-text);
        }

        .banner-body { display: flex; align-items: center; gap: 14px; }
        .banner-icon { font-size: 28px; flex-shrink: 0; line-height: 1; }
        .banner-title { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 3px; }
        .banner-sub { font-size: 13px; opacity: 0.8; }

        /* ── Stats Row ─────────────────────────────────────── */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); }
        .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 6px; }
        .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; color: var(--text); }
        .stat-value span { font-size: 14px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
        .stat-sub { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

        /* ── Status Card ───────────────────────────────────── */
        .status-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
            overflow: hidden; margin-bottom: 20px;
        }

        .card-header {
            padding: 18px 24px; border-bottom: 1px solid var(--border-soft);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface);
        }
        .card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
        .date-range { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

        /* Project group */
        .project-group { border-bottom: 1px solid var(--border-soft); }
        .project-group:last-child { border-bottom: none; }

        .project-label {
            padding: 10px 24px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-faint); background: var(--surface-2);
            border-bottom: 1px solid var(--border-soft);
        }

        /* Component row */
        .comp-row {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-soft);
            transition: background var(--transition);
        }
        .comp-row:last-child { border-bottom: none; }
        .comp-row:hover { background: var(--surface-2); }

        .comp-info {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .comp-left { display: flex; align-items: center; gap: 8px; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
            transition: background var(--transition);
        }
        .status-dot.up   { background: var(--up); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
        .status-dot.down { background: var(--down); box-shadow: 0 0 0 2px rgba(239,68,68,0.2); animation: pulse-down 1.5s infinite; }
        .status-dot.warn { background: var(--warn); box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }
        @keyframes pulse-down {
            0%, 100% { box-shadow: 0 0 0 2px rgba(239,68,68,0.2); }
            50% { box-shadow: 0 0 0 5px rgba(239,68,68,0.05); }
        }

        .comp-name { font-size: 14px; font-weight: 500; color: var(--text-2); }
        .comp-status-badge {
            font-size: 11px; font-weight: 600; padding: 2px 8px;
            border-radius: 20px; background: var(--up-bg); color: var(--up-text);
            border: 1px solid var(--up-border);
        }
        .comp-status-badge.down { background: var(--down-bg); color: var(--down-text); border-color: var(--down-border); }
        .comp-status-badge.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }

        .comp-right { display: flex; align-items: center; gap: 14px; }
        .comp-meta { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; }
        .comp-meta strong { color: var(--text); font-weight: 600; }
        .latency-badge {
            font-size: 11px; padding: 2px 7px; border-radius: 4px;
            background: var(--surface-2); color: var(--text-muted);
            border: 1px solid var(--border); font-variant-numeric: tabular-nums;
        }

        /* ── Bar Chart ─────────────────────────────────────── */
        .bars-wrap {
            display: flex; gap: 3px; height: 32px; align-items: flex-end;
        }
        .bar {
            flex: 1; min-width: 0; border-radius: 3px;
            height: 100%; position: relative; cursor: pointer;
            transition: opacity var(--transition), transform 0.1s ease;
        }
        .bar:hover { opacity: 0.75; transform: scaleY(1.06); transform-origin: bottom; }
        .bar.c-100  { background: var(--up); }
        .bar.c-good { background: #34d399; }
        .bar.c-warn { background: var(--warn); }
        .bar.c-bad  { background: var(--down); }
        .bar.c-none { background: var(--border); opacity: 0.6; }

        /* Tooltip */
        .bar-tip {
            display: none;
            position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--surface);
            padding: 10px 14px; border-radius: var(--radius-md);
            font-size: 12px; white-space: nowrap; min-width: 200px;
            box-shadow: var(--shadow-md); z-index: 200; text-align: left;
            pointer-events: none;
        }
        .bar-tip::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border: 5px solid transparent; border-top-color: var(--text);
        }
        .bar:hover .bar-tip { display: block; }
        .tip-date { color: rgba(255,255,255,0.55); font-size: 11px; margin-bottom: 6px; }
        [data-theme="dark"] .tip-date { color: rgba(0,0,0,0.5); }
        .tip-uptime { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .tip-outage { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.12); gap: 12px; }
        [data-theme="dark"] .tip-outage { border-top-color: rgba(0,0,0,0.15); }
        .tip-outage-label { color: #fbbf24; font-weight: 600; }
        .tip-outage-time { color: rgba(255,255,255,0.7); font-size: 11px; margin-top: 2px; }
        [data-theme="dark"] .tip-outage-time { color: rgba(0,0,0,0.5); }
        .tip-no-incidents { color: rgba(255,255,255,0.65); font-size: 11px; margin-top: 4px; }
        [data-theme="dark"] .tip-no-incidents { color: rgba(0,0,0,0.5); }

        .bars-label {
            display: flex; justify-content: space-between;
            font-size: 10px; color: var(--text-faint); margin-top: 6px;
        }

        /* ── Recent Outages Section ────────────────────────── */
        .incidents-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
            overflow: hidden; margin-bottom: 20px;
        }
        .incidents-empty {
            padding: 36px 24px; text-align: center;
            color: var(--text-muted); font-size: 13px;
        }
        .incidents-empty .ei-icon { font-size: 32px; margin-bottom: 10px; }

        .incident-row {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 16px 24px; border-bottom: 1px solid var(--border-soft);
            transition: background var(--transition);
        }
        .incident-row:last-child { border-bottom: none; }
        .incident-row:hover { background: var(--surface-2); }

        .incident-icon { font-size: 18px; margin-top: 1px; flex-shrink: 0; }
        .incident-body { flex: 1; min-width: 0; }
        .incident-service {
            font-weight: 600; font-size: 13px; color: var(--text);
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .ongoing-badge {
            font-size: 10px; font-weight: 700; padding: 2px 7px;
            background: var(--down-bg); color: var(--down-text);
            border: 1px solid var(--down-border); border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.4px;
            animation: fade-ongoing 1.5s infinite;
        }
        @keyframes fade-ongoing { 0%,100%{opacity:1} 50%{opacity:0.55} }
        .incident-time { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .incident-duration {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums;
        }

        /* ── Skeleton ──────────────────────────────────────── */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg,
                var(--border-soft) 25%,
                var(--border) 50%,
                var(--border-soft) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            border-radius: var(--radius-md);
        }
        .skel-banner { height: 90px; margin-bottom: 28px; }
        .skel-stats { height: 88px; margin-bottom: 28px; border-radius: var(--radius-lg); }
        .skel-card { height: 380px; }

        /* ── Footer ────────────────────────────────────────── */
        .site-footer {
            border-top: 1px solid var(--border);
            padding: 24px 0 32px;
            text-align: center; font-size: 12px; color: var(--text-faint);
        }
        .site-footer a { color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .site-footer a:hover { color: var(--text); text-decoration: underline; }

        /* ── Responsive ────────────────────────────────────── */
        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr; }
            .comp-right { flex-direction: column; align-items: flex-end; gap: 6px; }
            .header-right .last-updated { display: none; }
            .incident-duration { font-size: 12px; }
        }
        @media (max-width: 420px) {
            .wrap { padding: 0 14px; }
            .comp-row { padding: 14px 16px; }
            .card-header { padding: 14px 16px; }
            .bars-wrap { height: 26px; }
        }

        /* ── Animations ────────────────────────────────────── */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fade-in 0.3s ease both; }
    </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
    <div class="wrap">
        <div class="header-inner">
            <a href="/" class="logo" id="site-logo">
                <div class="logo-mark">D</div>
                <span class="logo-text" id="logo-name">Darrov Status</span>
            </a>
            <div class="header-right">
                <div class="last-updated" id="last-updated-label">
                    <span class="live-dot"></span>
                    <span id="last-updated-text">Loading…</span>
                </div>
                <button class="theme-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">🌙</button>
            </div>
        </div>
    </div>
</header>

<!-- Main -->
<main>
    <div class="wrap">
        <div class="page-body">
            <div id="app-root">
                <!-- Skeleton -->
                <div class="skeleton skel-banner"></div>
                <div class="skeleton skel-stats"></div>
                <div class="skeleton skel-card"></div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="site-footer">
    <div class="wrap">
        Powered by <a href="https://status.darrov.uz" id="footer-link">Darrov Status Monitor</a>
        &nbsp;·&nbsp;
        <span id="footer-updated">Updated just now</span>
    </div>
</footer>

<script>
    'use strict';

    const API_BASE = '/api/v1';
    const root = document.getElementById('app-root');
    const TARGET_SERVICES = ["AlfaConnect", "Mehmonxona", "Odimrepo", "Tokpoint", "Datan"];

    // Cache for short TTL
    const cache = {
        services: { data: null, expires: 0 },
        incidents: {},
        uptime: {}
    };
    const TTL_MS = 30000;

    // ── Theme ──────────────────────────────────────────────
    const themeBtn = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', saved);
    themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    // ── Helpers ────────────────────────────────────────────
    function fmtDuration(secs) {
        if (!secs || secs <= 0) return '< 1 min';
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        if (h === 0 && m === 0) return '< 1 min';
        let s = '';
        if (h > 0) s += `${h}h `;
        if (m > 0 || h === 0) s += `${m}m`;
        return s.trim();
    }

    function fmtTime(isoStr) {
        if (!isoStr) return '—';
        try {
            return new Date(isoStr).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        } catch (e) { return isoStr; }
    }

    function fmtDateTime(isoStr) {
        if (!isoStr) return '—';
        try {
            const d = new Date(isoStr);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return isoStr; }
    }

    function fmtDate(dateStr) {
        try {
            return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        } catch (e) { return dateStr; }
    }

    function timeAgo(isoStr) {
        if (!isoStr) return 'just now';
        try {
            const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff/60)} min ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            return fmtDateTime(isoStr);
        } catch (e) { return 'just now'; }
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    // ── Fetch ──────────────────────────────────────────────
    async function fetchWithCache(url, cacheObj, key) {
        const now = Date.now();
        const cached = cacheObj[key];
        if (cached && cached.expires > now) return cached.data;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        cacheObj[key] = { data, expires: now + TTL_MS };
        return data;
    }

    async function fetchStatus() {
        try {
            const services = await fetchWithCache(`${API_BASE}/services`, cache, 'services');
            
            const serviceMap = new Map();
            services.forEach(s => serviceMap.set(s.name, s));

            const renderData = [];
            let activeIncidents = 0;
            let totalUptimeSum = 0;
            let validUptimeCount = 0;
            const recentOutages = [];

            for (const name of TARGET_SERVICES) {
                const s = serviceMap.get(name);
                if (!s) continue;

                let uptimeData = null;
                let incidentsData = { incidents: [] };
                try {
                    uptimeData = await fetchWithCache(`${API_BASE}/services/${name}/uptime?window=24h`, cache.uptime, name);
                    incidentsData = await fetchWithCache(`${API_BASE}/services/${name}/incidents?limit=100`, cache.incidents, name);
                } catch (e) {
                    console.error(`Error fetching details for ${name}:`, e);
                }

                // A service has a partial status if last_status is "up" but open_incidents_count > 0
                const isPartial = s.last_status === 'up' && s.open_incidents_count > 0;
                if (s.last_status === 'down' || isPartial) {
                    activeIncidents++;
                }

                if (uptimeData) {
                    totalUptimeSum += uptimeData.uptime_percent;
                    validUptimeCount++;
                }
                
                (incidentsData.incidents || []).forEach(inc => {
                   recentOutages.push(inc);
                });

                renderData.push({
                    service: s,
                    isPartial: isPartial,
                    uptime: uptimeData,
                    incidents: incidentsData.incidents || []
                });
            }

            const overallUptime = validUptimeCount > 0 ? (totalUptimeSum / validUptimeCount) : 100;
            
            // Sort recent outages by start_time descending
            recentOutages.sort((a,b) => new Date(b.start_time).getTime() - new Date(a.start_time).getTime());
            // Take top 10 globally for the recent outages section
            const topOutages = recentOutages.slice(0, 10);

            render(renderData, overallUptime, activeIncidents, renderData.length, topOutages);
            window._lastUpdatedISO = new Date().toISOString();
        } catch (err) {
            renderError(err.message);
        }
    }

    function computeSparkline(incidents = []) {
        const days = [];
        const now = Date.now();
        for (let i = 6; i >= 0; i--) {
            const dStart = new Date(now - i * 86400000);
            dStart.setHours(0,0,0,0);
            const startTs = dStart.getTime();
            const endTs = startTs + 86400000;

            let dayDowntimeSecs = 0;
            const dayIncidents = [];

            incidents.forEach(inc => {
                const iStart = new Date(inc.start_time).getTime();
                const iEnd = inc.end_time ? new Date(inc.end_time).getTime() : now;
                
                if (iStart < endTs && iEnd > startTs) {
                    const overlapStart = Math.max(startTs, iStart);
                    const overlapEnd = Math.min(endTs, iEnd);
                    const durSecs = (overlapEnd - overlapStart) / 1000;
                    dayDowntimeSecs += durSecs;
                    dayIncidents.push({ ...inc, duration_seconds: durSecs, start: new Date(overlapStart).toISOString(), end: new Date(overlapEnd).toISOString() });
                }
            });

            let pct = 100 - (dayDowntimeSecs / 86400) * 100;
            if (pct < 0) pct = 0;
            
            days.push({
                date: dStart.toISOString(),
                pct: pct,
                outages: dayIncidents,
                is_up: pct >= 100
            });
        }
        return days;
    }

    // ── Render ─────────────────────────────────────────────
    function render(servicesData, overallUptime, activeIncidents, totalSvc, topOutages) {
        document.title = 'Darrov Status — ' + (activeIncidents === 0 ? 'All Systems Operational' : 'Incidents Active');
        const upPct = overallUptime.toFixed(3);

        let bannerClass = 'operational';
        let bannerIcon = '✅';
        let bannerTitle = "We're fully operational";
        let bannerSub = "No incidents affecting our systems.";

        if (activeIncidents > 0) {
            const hasDown = servicesData.some(d => d.service.last_status === 'down');
            if (hasDown) {
                bannerClass = 'outage';
                bannerIcon = '🔴';
                bannerTitle = 'Major System Outage';
                bannerSub = 'We are experiencing widespread issues affecting our systems.';
            } else {
                bannerClass = 'degraded';
                bannerIcon = '⚠️';
                bannerTitle = 'Partial System Outage';
                bannerSub = 'Some services are experiencing issues right now.';
            }
        }

        const now = Date.now();
        const d0 = fmtDate(new Date(now - 6 * 86400000).toISOString());
        const d1 = fmtDate(new Date(now).toISOString());
        const dateRangeStr = `${d0} – ${d1}`;

        let html = `
<div class="status-banner ${bannerClass} fade-in">
    <div class="banner-body">
        <div class="banner-icon">${bannerIcon}</div>
        <div>
            <div class="banner-title">${escHtml(bannerTitle)}</div>
            <div class="banner-sub">${escHtml(bannerSub)}</div>
        </div>
    </div>
</div>

<div class="stats-row fade-in">
    <div class="stat-card">
        <div class="stat-label">24h Uptime</div>
        <div class="stat-value">${upPct}<span>%</span></div>
        <div class="stat-sub">Overall across all services</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Services</div>
        <div class="stat-value">${totalSvc}</div>
        <div class="stat-sub">Monitored components</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Incidents</div>
        <div class="stat-value" style="color: ${activeIncidents > 0 ? 'var(--down)' : 'var(--up)'}">
            ${activeIncidents}
        </div>
        <div class="stat-sub">${activeIncidents === 0 ? 'All systems normal' : 'Services currently affected'}</div>
    </div>
</div>

<div class="status-card fade-in">
    <div class="card-header">
        <div class="card-title">System Status</div>
        <div class="date-range">‹ ${escHtml(dateRangeStr)} ›</div>
    </div>
`;

        if (servicesData.length === 0) {
            html += `<div style="padding: 48px; text-align:center; color:var(--text-muted)">No services configured yet.</div>`;
        } else {
            servicesData.forEach(data => {
                html += renderComponent(data);
            });
        }

        html += `</div>`; // .status-card
        html += renderOutagesSection(topOutages);
        root.innerHTML = html;
    }

    function renderComponent(data) {
        const { service, isPartial, uptime, incidents } = data;
        const isDown = service.last_status === 'down';
        const isUp = !isDown && !isPartial;
        
        let dotClass = 'up';
        let statusText = 'Operational';
        let badgeClass = '';

        if (isDown) {
            dotClass = 'down';
            statusText = 'Outage';
            badgeClass = 'down';
        } else if (isPartial) {
            dotClass = 'warn';
            statusText = 'Degraded';
            badgeClass = 'warn';
        }

        const pct = uptime ? uptime.uptime_percent : 100;
        
        const history = computeSparkline(incidents);
        let barsHtml = '';
        history.forEach(day => {
            const p = day.pct;
            let barClass = 'c-none';
            if (p >= 100)      barClass = 'c-100';
            else if (p >= 90)  barClass = 'c-good';
            else if (p >= 50)  barClass = 'c-warn';
            else if (p >= 0)   barClass = 'c-bad';

            const dateFmt = fmtDate(day.date);
            let tipContent = `<div class="tip-date">${escHtml(dateFmt)}</div>`;

            if (!day.outages || day.outages.length === 0) {
                tipContent += `<div class="tip-uptime">${p >= 100 ? '100.000' : p.toFixed(3)}% uptime</div>`;
                tipContent += `<div class="tip-no-incidents">No incidents this day</div>`;
            } else {
                tipContent += `<div class="tip-uptime">${p.toFixed(3)}% uptime</div>`;
                day.outages.forEach(o => {
                    const dur = fmtDuration(o.duration_seconds);
                    const tStart = fmtTime(o.start);
                    const tEnd = fmtTime(o.end);
                    tipContent += `
<div class="tip-outage">
    <div>
        <div class="tip-outage-label">⚠ Outage &nbsp; ${escHtml(dur)}</div>
        <div class="tip-outage-time">${escHtml(tStart)} – ${escHtml(tEnd)}</div>
    </div>
</div>`;
                });
            }
            barsHtml += `<div class="bar ${barClass}"><div class="bar-tip">${tipContent}</div></div>`;
        });

        // Construct <details> for incident details
        let recentIncidentsHtml = '';
        if (incidents.length > 0) {
            const recent = incidents.slice(0, 10);
            recentIncidentsHtml = `
            <details class="comp-details" style="margin-top: 12px; font-size: 13px;" aria-expanded="false" role="region" aria-labelledby="summary-${service.id}">
                <summary id="summary-${service.id}" style="cursor: pointer; color: var(--accent); user-select: none;">View recent incidents</summary>
                <div style="margin-top: 10px; padding: 10px; background: var(--surface-2); border-radius: var(--radius-sm);">
                    ${recent.map(inc => `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid var(--border-soft); padding-bottom: 8px;">
                            <div>
                                <strong style="color: ${inc.status === 'open' ? 'var(--down)' : 'var(--text)'}">
                                    ${inc.status === 'open' ? '🔴 Ongoing' : '⚫ Closed'}
                                </strong>
                                <br/>
                                <span style="color: var(--text-muted); font-size: 11px;">
                                    ${fmtDateTime(inc.start_time)} &rarr; ${inc.status === 'closed' ? fmtDateTime(inc.end_time) : 'Now'}
                                </span>
                            </div>
                            <div style="font-variant-numeric: tabular-nums;">
                                ${inc.status === 'closed' ? fmtDuration(inc.duration_seconds) : '—'}
                            </div>
                        </div>
                    `).join('')}
                    <button onclick="openHistoryModal('${escHtml(service.name)}')" style="background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; padding: 0;">View full history</button>
                </div>
            </details>
            `;
        }

        return `
<div class="comp-row">
    <div class="comp-info">
        <div class="comp-left">
            <div class="status-dot ${dotClass}"></div>
            <div class="comp-name">${escHtml(service.name)}</div>
            <div class="comp-status-badge ${badgeClass}">${escHtml(statusText)}</div>
        </div>
        <div class="comp-right">
            <div class="comp-meta">
                <strong>${pct.toFixed(3)}%</strong> 24h uptime
            </div>
        </div>
    </div>
    <div class="bars-wrap">${barsHtml}</div>
    <div class="bars-label">
        <span>7 days ago</span>
        <span>Today</span>
    </div>
    ${recentIncidentsHtml}
</div>`;
    }

    function renderOutagesSection(outages) {
        let html = `
<div class="incidents-card fade-in">
    <div class="card-header">
        <div class="card-title">Recent Incidents</div>
        <div class="date-range">Last 7 days</div>
    </div>`;

        if (!outages || outages.length === 0) {
            html += `
<div class="incidents-empty">
    <div class="ei-icon">🎉</div>
    <div>No incidents recently</div>
    <div style="margin-top:6px; font-size:12px; color:var(--text-faint)">All systems have been running smoothly</div>
</div>`;
        } else {
            outages.forEach(o => {
                const isOngoing = o.status === 'open';
                const dur = isOngoing ? '—' : fmtDuration(o.duration_seconds);
                const startFmt = fmtDateTime(o.start_time);
                const endFmt = isOngoing ? 'Ongoing' : fmtDateTime(o.end_time);

                html += `
<div class="incident-row">
    <div class="incident-icon">${isOngoing ? '🔴' : '⚠️'}</div>
    <div class="incident-body">
        <div class="incident-service">
            ${escHtml(o.service_name)}
            ${isOngoing ? '<span class="ongoing-badge">Ongoing</span>' : ''}
        </div>
        <div class="incident-time">${escHtml(startFmt)} → ${escHtml(endFmt)}</div>
    </div>
    <div class="incident-duration">${escHtml(dur)}</div>
</div>`;
            });
        }
        html += `</div>`;
        return html;
    }

    function renderError(msg) {
        root.innerHTML = `
<div class="status-banner outage fade-in">
    <div class="banner-body">
        <div class="banner-icon">🔴</div>
        <div>
            <div class="banner-title">Connection Error</div>
            <div class="banner-sub">Unable to fetch system status. Retrying in 30 seconds…</div>
        </div>
    </div>
</div>`;
        const lu = document.getElementById('last-updated-text');
        if (lu) lu.textContent = 'Connection error';
    }

    // ── Modals ─────────────────────────────────────────────
    let currentModalService = null;
    let currentModalOffset = 0;
    const MODAL_LIMIT = 10;

    async function openHistoryModal(serviceName) {
        currentModalService = serviceName;
        currentModalOffset = 0;
        
        let modal = document.getElementById('history-modal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'history-modal';
            modal.setAttribute('role', 'dialog');
            modal.setAttribute('aria-modal', 'true');
            modal.setAttribute('aria-labelledby', 'modal-title');
            modal.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;';
            modal.innerHTML = `
                <div style="background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); display: flex; flex-direction: column; max-height: 80vh;">
                    <div style="padding: 16px 20px; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center;">
                        <h2 id="modal-title" style="font-size: 16px; margin: 0;">History: <span id="modal-service-name"></span></h2>
                        <button onclick="closeHistoryModal()" aria-label="Close modal" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">&times;</button>
                    </div>
                    <div id="modal-content" style="padding: 20px; overflow-y: auto; flex: 1;">Loading...</div>
                    <div style="padding: 16px 20px; border-top: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center;">
                        <button id="modal-prev" onclick="changeHistoryPage(-1)" disabled style="padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;">Previous</button>
                        <span id="modal-page-info" style="font-size: 13px; color: var(--text-muted);"></span>
                        <button id="modal-next" onclick="changeHistoryPage(1)" disabled style="padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;">Next</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.getElementById('history-modal') && document.getElementById('history-modal').style.display !== 'none') {
                    closeHistoryModal();
                }
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeHistoryModal();
            });
        }
        
        
        document.getElementById('modal-service-name').textContent = serviceName;
        modal.style.display = 'flex';
        
        // Focus trap
        const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
        const firstFocusable = modal.querySelectorAll(focusableElements)[0];
        const focusableContent = modal.querySelectorAll(focusableElements);
        const lastFocusable = focusableContent[focusableContent.length - 1];
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab' && modal.style.display !== 'none') {
                const focusables = modal.querySelectorAll(focusableElements);
                if (focusables.length === 0) return;
                const first = focusables[0];
                const last = focusables[focusables.length - 1];
                if (e.shiftKey) {
                    if (document.activeElement === first) {
                        last.focus();
                        e.preventDefault();
                    }
                } else {
                    if (document.activeElement === last) {
                        first.focus();
                        e.preventDefault();
                    }
                }
            }
        });
        
        if (firstFocusable) {
            firstFocusable.focus();
        }
        
        await loadHistoryPage();
    }

    function closeHistoryModal() {
        const modal = document.getElementById('history-modal');
        if (modal) modal.style.display = 'none';
        currentModalService = null;
    }

    async function changeHistoryPage(dir) {
        currentModalOffset += dir * MODAL_LIMIT;
        if (currentModalOffset < 0) currentModalOffset = 0;
        await loadHistoryPage();
    }

    async function loadHistoryPage() {
        const content = document.getElementById('modal-content');
        const prevBtn = document.getElementById('modal-prev');
        const nextBtn = document.getElementById('modal-next');
        const pageInfo = document.getElementById('modal-page-info');
        
        content.innerHTML = 'Loading...';
        prevBtn.disabled = true;
        nextBtn.disabled = true;

        try {
            const url = `${API_BASE}/services/${currentModalService}/incidents?limit=${MODAL_LIMIT}&offset=${currentModalOffset}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to load');
            const data = await res.json();
            
            const total = data.total || 0;
            const incs = data.incidents || [];
            
            if (incs.length === 0) {
                content.innerHTML = '<div style="text-align: center; color: var(--text-muted);">No incidents found.</div>';
            } else {
                content.innerHTML = incs.map(inc => `
                    <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft);">
                        <strong style="color: ${inc.status === 'open' ? 'var(--down)' : 'var(--text)'}">
                            ${inc.status === 'open' ? '🔴 Ongoing' : '⚫ Closed'}
                        </strong><br/>
                        <span style="font-size: 13px; color: var(--text-2);">
                            ${fmtDateTime(inc.start_time)} &rarr; ${inc.status === 'closed' ? fmtDateTime(inc.end_time) : 'Now'}
                        </span><br/>
                        <span style="font-size: 12px; color: var(--text-muted);">Duration: ${inc.status === 'closed' ? fmtDuration(inc.duration_seconds) : '—'}</span>
                    </div>
                `).join('');
            }
            
            pageInfo.textContent = `Showing ${currentModalOffset + 1} - ${Math.min(currentModalOffset + MODAL_LIMIT, Math.max(1, total))} of ${total}`;
            prevBtn.disabled = currentModalOffset === 0;
            nextBtn.disabled = (currentModalOffset + MODAL_LIMIT) >= total;
            
        } catch (e) {
            content.innerHTML = `<div style="color: var(--down);">Error loading history: ${e.message}</div>`;
        }
    }

    // ── Init ───────────────────────────────────────────────
    fetchStatus();
    setInterval(fetchStatus, 30000);

    setInterval(() => {
        const el = document.getElementById('last-updated-text');
        if (el && window._lastUpdatedISO) {
            el.textContent = 'Updated ' + timeAgo(window._lastUpdatedISO);
        }
    }, 30000);

    // ── WebSocket ──────────────────────────────────────────
    function connectWS() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${location.host}/ws`);
        let debounceTimer = null;

        ws.onopen = () => console.log('[WS] Connected');
        ws.onclose = () => setTimeout(connectWS, 5000);
        ws.onmessage = () => {
            if (debounceTimer) return;
            debounceTimer = setTimeout(() => {
                debounceTimer = null;
                fetchStatus();
            }, 2000);
        };
    }
    connectWS();
</script>
</body>
</html>
