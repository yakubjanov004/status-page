<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .history-bar {
            width: 14%; /* Roughly 1/7th minus gap */
            height: 36px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .history-bar:hover {
            transform: scaleY(1.1);
            filter: brightness(1.2);
        }
        .bar-up { background-color: #10b981; }
        .bar-down { background-color: #ef4444; }
        .bar-empty { background-color: #334155; }
        
        .pulse-green {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col" x-data="statusPage()">

    <header class="w-full py-6 px-4 md:px-8 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/50">
                S
            </div>
            <h1 class="text-xl font-bold tracking-tight">Status</h1>
        </div>
        <a href="/admin" class="text-sm text-slate-400 hover:text-white transition-colors">Admin Area</a>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-12">
        
        <!-- Status Banner -->
        <div class="mb-12 rounded-2xl p-6 glass-panel flex items-center justify-between"
             :class="isAllUp() ? 'border-emerald-500/30' : 'border-red-500/30'">
            <div class="flex items-center gap-4">
                <div class="w-4 h-4 rounded-full" 
                     :class="isAllUp() ? 'bg-emerald-500 pulse-green' : 'bg-red-500 pulse-red'"></div>
                <h2 class="text-2xl font-bold" x-text="data.status || 'Loading...'"></h2>
            </div>
            <div class="text-slate-400 text-sm">
                Updated just now
            </div>
        </div>

        <!-- Project List -->
        <div class="space-y-8">
            <template x-for="project in data.projects" :key="project.id">
                <div class="glass-panel rounded-xl p-6 transition-all hover:bg-slate-800/80">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold flex items-center gap-3" x-text="project.name"></h3>
                        <div class="text-sm font-medium">
                            <span class="px-2 py-1 rounded text-xs font-bold uppercase tracking-wide"
                                  :class="getProjectStatusClass(project)"
                                  x-text="getProjectStatusText(project)"></span>
                        </div>
                    </div>
                    
                    <div class="space-y-6">
                        <!-- Frontend Component -->
                        <template x-if="project.frontend">
                            <div class="pl-4 border-l-2 border-slate-700">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="text-slate-300 font-medium">Frontend</h4>
                                    <div class="text-sm" :class="project.frontend.is_up ? 'text-emerald-400' : 'text-red-400'">
                                        <span x-text="project.frontend.uptime_pct.toFixed(2) + '%'"></span> uptime
                                    </div>
                                </div>
                                <div class="flex items-end justify-between mt-2 overflow-hidden h-10 w-full gap-1">
                                    <template x-for="day in project.frontend.history">
                                        <div class="flex-grow history-bar"
                                             :class="day.is_up ? 'bar-up' : 'bar-down'"
                                             :title="day.date + ' - ' + (day.is_up ? 'Operational' : 'Outage')">
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Backend Component -->
                        <template x-if="project.backend">
                            <div class="pl-4 border-l-2 border-slate-700">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="text-slate-300 font-medium">Backend</h4>
                                    <div class="text-sm" :class="project.backend.is_up ? 'text-emerald-400' : 'text-red-400'">
                                        <span x-text="project.backend.uptime_pct.toFixed(2) + '%'"></span> uptime
                                    </div>
                                </div>
                                <div class="flex items-end justify-between mt-2 overflow-hidden h-10 w-full gap-1">
                                    <template x-for="day in project.backend.history">
                                        <div class="flex-grow history-bar"
                                             :class="day.is_up ? 'bar-up' : 'bar-down'"
                                             :title="day.date + ' - ' + (day.is_up ? 'Operational' : 'Outage')">
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="flex justify-between text-xs text-slate-500 mt-4 pt-4 border-t border-slate-800">
                        <span>7 days ago</span>
                        <span>Today</span>
                    </div>
                </div>
            </template>
            
            <div x-show="data.projects && data.projects.length === 0" class="text-center py-12 text-slate-500">
                No projects configured yet.
            </div>
        </div>
    </main>

    <footer class="w-full py-6 text-center text-sm text-slate-500 border-t border-slate-800">
        Powered by Self-Hosted Status Page
    </footer>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('statusPage', () => ({
                data: { projects: [], status: 'Loading...' },
                ws: null,

                init() {
                    this.fetchData();
                    this.connectWebSocket();
                },

                async fetchData() {
                    try {
                        const res = await fetch('/api/public/status');
                        const json = await res.json();
                        this.data = json;
                    } catch (e) {
                        console.error('Failed to fetch status', e);
                        this.data.status = 'Error fetching status';
                    }
                },

                connectWebSocket() {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    this.ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
                    
                    this.ws.onmessage = (event) => {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'heartbeat_update') {
                            this.fetchData(); 
                        }
                    };
                    
                    this.ws.onclose = () => {
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };
                },

                isAllUp() {
                    if (!this.data.projects) return true;
                    for (const p of this.data.projects) {
                        if (p.frontend && !p.frontend.is_up) return false;
                        if (p.backend && !p.backend.is_up) return false;
                    }
                    return true;
                },

                getProjectStatusText(project) {
                    let total = 0;
                    let down = 0;
                    if (project.frontend) { total++; if (!project.frontend.is_up) down++; }
                    if (project.backend) { total++; if (!project.backend.is_up) down++; }
                    
                    if (down === 0) return 'Operational';
                    if (down === total) return 'Outage';
                    return 'Partial Outage';
                },

                getProjectStatusClass(project) {
                    const text = this.getProjectStatusText(project);
                    if (text === 'Operational') return 'bg-emerald-500/20 text-emerald-400';
                    if (text === 'Outage') return 'bg-red-500/20 text-red-400';
                    return 'bg-amber-500/20 text-amber-400';
                }
            }));
        });
    </script>
</body>
</html>
