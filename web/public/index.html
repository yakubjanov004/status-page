<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status — Darrov</title>
    <meta name="description" content="Real-time system status monitoring for Darrov services">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#050a15;color:#e2e8f0}

        .page-bg{
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(16,185,129,0.03), transparent);
        }

        .glass{
            background:rgba(15,23,42,0.6);
            backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,0.05);
        }

        /* Pulse dots */
        @keyframes p-g{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0.2)}}
        @keyframes p-r{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0.2)}}
        @keyframes p-y{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0.2)}}
        .dot-up{background:#10b981;animation:p-g 2.5s infinite}
        .dot-down{background:#ef4444;animation:p-r 2.5s infinite}
        .dot-warn{background:#f59e0b;animation:p-y 2.5s infinite}

        /* History bars */
        .hbar{flex:1;min-width:0;border-radius:3px;transition:transform .1s,filter .1s;cursor:default;position:relative}
        .hbar:hover{transform:scaleY(1.2);filter:brightness(1.3)}
        .tip{visibility:hidden;opacity:0;transition:opacity .12s,visibility .12s}
        .hbar:hover .tip{visibility:visible;opacity:1}

        /* Skeleton */
        @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
        .skel{background:linear-gradient(90deg,rgba(30,41,59,.7) 25%,rgba(51,65,85,.3) 50%,rgba(30,41,59,.7) 75%);background-size:400px 100%;animation:shimmer 1.2s infinite;border-radius:14px}

        /* Fade in */
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        .fade-up{animation:fadeUp .3s ease forwards}

        /* Badge */
        .badge{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;white-space:nowrap}
        .badge-up{background:rgba(16,185,129,.1);color:#34d399}
        .badge-down{background:rgba(239,68,68,.1);color:#f87171}
        .badge-part{background:rgba(245,158,11,.1);color:#fbbf24}

        /* Bar colors by uptime % */
        .bar-100{background:#10b981}
        .bar-90{background:#22c55e}
        .bar-70{background:#f59e0b}
        .bar-50{background:#f97316}
        .bar-0{background:#ef4444}
        .bar-none{background:rgba(51,65,85,0.4)}
    </style>
</head>
<body class="page-bg min-h-screen flex flex-col" x-data="statusApp()" x-init="init()">

    <!-- Header -->
    <header class="w-full py-4 px-5 md:px-8 flex items-center justify-between border-b border-white/5">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center font-black text-white text-sm shadow-lg shadow-indigo-500/25">D</div>
            <span class="font-bold text-slate-100 text-[15px] tracking-tight">Darrov Status</span>
        </div>
        <div class="flex items-center gap-1.5 text-[11px] text-slate-500">
            <span class="w-1.5 h-1.5 rounded-full transition-colors" :class="live ? 'bg-emerald-400' : 'bg-slate-600'"></span>
            <span x-text="live ? 'Live' : 'Connecting...'"></span>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8 space-y-5">

        <!-- Skeleton -->
        <template x-if="loading">
            <div class="space-y-4">
                <div class="skel h-[68px] w-full"></div>
                <div class="skel h-[160px] w-full"></div>
                <div class="skel h-[160px] w-full"></div>
                <div class="skel h-[120px] w-full"></div>
                <div class="skel h-[120px] w-full"></div>
            </div>
        </template>

        <template x-if="!loading">
            <div class="space-y-4 fade-up">

                <!-- Overall Banner -->
                <div class="glass rounded-2xl px-5 py-4 flex items-center justify-between"
                     :class="bannerBorder()"
                     :style="bannerGlow()">
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-3 rounded-full shrink-0" :class="bannerDot()"></div>
                        <div>
                            <div class="font-bold text-white text-[17px] leading-tight" x-text="data.status || 'Loading...'"></div>
                            <div class="text-[11px] text-slate-500 mt-0.5" x-text="updated"></div>
                        </div>
                    </div>
                </div>

                <!-- Projects -->
                <template x-for="(proj, pi) in data.projects" :key="proj.id">
                    <div class="glass rounded-2xl overflow-hidden fade-up" :style="'animation-delay:' + (pi*50) + 'ms'">

                        <!-- Project header -->
                        <div class="px-5 py-3.5 flex items-center justify-between border-b border-white/[0.04]">
                            <div class="flex items-center gap-2.5">
                                <div class="w-2 h-2 rounded-full shrink-0" :class="projDot(proj)"></div>
                                <span class="font-bold text-white text-[15px]" x-text="proj.name"></span>
                            </div>
                            <span class="badge" :class="projBadgeClass(proj)" x-text="projLabel(proj)"></span>
                        </div>

                        <!-- Components -->
                        <div class="divide-y divide-white/[0.03]">
                            <template x-for="(c, ci) in proj.components" :key="ci">
                                <div class="px-5 py-3.5">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center gap-2">
                                            <div class="w-1.5 h-1.5 rounded-full" :class="c.is_up ? 'bg-emerald-400' : 'bg-red-400'"></div>
                                            <span class="text-[13px] font-semibold text-slate-200" x-text="c.name"></span>
                                            <template x-if="c.latency > 0 && c.is_up">
                                                <span class="text-[10px] text-slate-500 font-mono" x-text="c.latency + 'ms'"></span>
                                            </template>
                                        </div>
                                        <span class="text-[11px] font-bold tabular-nums"
                                              :class="uptimeColor(c.uptime_pct)"
                                              x-text="c.uptime_pct.toFixed(1) + '%'"></span>
                                    </div>

                                    <!-- 7-day bars -->
                                    <div class="flex gap-[2px] items-end h-[26px]">
                                        <template x-for="(d, di) in c.history" :key="di">
                                            <div class="hbar h-full" :class="barClass(d)">
                                                <div class="tip absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 px-2.5 py-1 bg-slate-900/95 border border-white/10 text-[10px] text-white rounded-lg shadow-xl whitespace-nowrap z-30">
                                                    <span x-text="fmtDate(d.date)"></span>
                                                    <span class="ml-1 font-bold" :class="d.is_up ? 'text-emerald-400' : 'text-red-400'" x-text="d.pct !== undefined ? d.pct.toFixed(0) + '%' : (d.is_up ? 'Up' : 'Down')"></span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="flex justify-between text-[10px] text-slate-600 mt-1">
                                        <span>7 days ago</span>
                                        <span>Today</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Empty state -->
                <template x-if="data.projects && data.projects.length === 0">
                    <div class="glass rounded-2xl px-5 py-14 text-center text-slate-500">
                        <div class="text-3xl mb-2">📡</div>
                        <div class="font-medium text-sm">No services configured</div>
                    </div>
                </template>
            </div>
        </template>
    </main>

    <footer class="text-center text-[11px] text-slate-700 py-6 border-t border-white/5">
        Powered by <span class="text-slate-500 font-medium">Darrov Monitoring</span>
    </footer>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('statusApp', () => ({
            data: { projects: [], status: '' },
            loading: true,
            live: false,
            ws: null,
            updated: '',
            _debounce: null,

            init() {
                this.fetchData();
                this.connectWS();
                setInterval(() => this.fetchData(), 30000);
            },

            async fetchData() {
                try {
                    const r = await fetch('/api/public/status');
                    if (!r.ok) throw new Error(r.status);
                    this.data = await r.json();
                    this.updated = 'Updated ' + new Date().toLocaleTimeString();
                } catch(e) {
                    this.data.status = 'Connection Error';
                } finally { this.loading = false; }
            },

            connectWS() {
                const p = location.protocol === 'https:' ? 'wss:' : 'ws:';
                this.ws = new WebSocket(`${p}//${location.host}/ws`);
                this.ws.onopen  = () => this.live = true;
                this.ws.onclose = () => { this.live = false; setTimeout(() => this.connectWS(), 5000); };
                this.ws.onerror = () => this.live = false;
                this.ws.onmessage = () => {
                    // Debounce — 2 soniya ichida bitta fetch
                    if (this._debounce) return;
                    this._debounce = setTimeout(() => { this._debounce = null; }, 2000);
                    this.fetchData();
                };
            },

            // Banner helpers
            bannerBorder() {
                const s = this.data.status || '';
                if (s.includes('Operational')) return 'border-emerald-500/15';
                if (s.includes('Partial') || s.includes('Degraded')) return 'border-amber-500/15';
                return 'border-red-500/15';
            },
            bannerGlow() {
                const s = this.data.status || '';
                if (s.includes('Operational')) return 'box-shadow:0 0 50px rgba(16,185,129,.03)';
                if (s.includes('Partial') || s.includes('Degraded')) return 'box-shadow:0 0 50px rgba(245,158,11,.03)';
                return 'box-shadow:0 0 50px rgba(239,68,68,.03)';
            },
            bannerDot() {
                const s = this.data.status || '';
                if (s.includes('Operational')) return 'dot-up';
                if (s.includes('Partial') || s.includes('Degraded')) return 'dot-warn';
                return 'dot-down';
            },

            // Project helpers
            projDot(p) {
                const l = this.projLabel(p);
                if (l === 'Operational') return 'dot-up';
                if (l === 'Down') return 'dot-down';
                return 'dot-warn';
            },
            projLabel(p) {
                if (!p.components || !p.components.length) return 'No Data';
                const down = p.components.filter(c => !c.is_up).length;
                if (down === 0) return 'Operational';
                if (down === p.components.length) return 'Down';
                return 'Degraded';
            },
            projBadgeClass(p) {
                const l = this.projLabel(p);
                if (l === 'Operational') return 'badge-up';
                if (l === 'Down') return 'badge-down';
                return 'badge-part';
            },

            // Component helpers
            uptimeColor(pct) {
                if (pct >= 99) return 'text-emerald-400';
                if (pct >= 90) return 'text-amber-400';
                return 'text-red-400';
            },
            barClass(d) {
                if (d.pct === undefined) return d.is_up ? 'bar-100' : 'bar-0';
                if (d.pct >= 100) return 'bar-100';
                if (d.pct >= 90) return 'bar-90';
                if (d.pct >= 70) return 'bar-70';
                if (d.pct >= 50) return 'bar-50';
                if (d.pct > 0) return 'bar-0';
                return 'bar-none';
            },
            fmtDate(s) {
                try { return new Date(s+'T00:00:00').toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
                catch { return s; }
            }
        }));
    });
    </script>
</body>
</html>
